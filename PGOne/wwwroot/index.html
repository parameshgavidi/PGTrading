<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PG One - SuperTrend Trading</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="images/pgone_logo.png" type="image/png" />
</head>
<body>
    <div id="app">
        <div style="color:#fff;font-family:'Segoe UI',sans-serif;padding:24px;">Loading PG One…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <div id="pg-diag"></div>

    <script>
        (function () {
            function diag(msg) {
                var d = document.getElementById('pg-diag');
                if (!d) return;
                d.style.display = 'block';
                d.textContent += msg + "\n";
            }
            // Capture=true also catches failed resource loads (e.g. blazor.webview.js 404).
            window.addEventListener('error', function (e) {
                if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK' || e.target.tagName === 'IMG')) {
                    diag('Failed to load: ' + (e.target.src || e.target.href));
                } else {
                    diag('JS error: ' + (e.message || (e.error && e.error.message) || e) +
                        (e.filename ? ('  @ ' + e.filename + ':' + e.lineno) : ''));
                }
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                diag('Promise error: ' + (e.reason && (e.reason.message || e.reason)));
            });
            // Watchdog: report if the Blazor layout never renders.
            setTimeout(function () {
                if (!document.querySelector('.app-shell')) {
                    diag('Blazor did not render within 7s.\n' +
                        'The host page loaded, but no Razor component mounted.\n\n' +
                        'Try:\n' +
                        '  1. .\\sync-maui-version.ps1  (align MAUI packages with workload)\n' +
                        '  2. .\\clean.ps1 then rebuild (F5)\n' +
                        '  3. .\\install-webview2.ps1  (install WebView2 Runtime)\n' +
                        '  4. .\\verify-build.ps1  (confirm _framework/blazor.webview.js exists)');
                }
            }, 7000);
        })();
    </script>
    <script src="js/chart.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
